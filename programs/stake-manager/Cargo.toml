[package]
name = "stake-manager"
version = "0.1.0"
description = "StaFi's solana lsd stake manager program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0", features = ["stake", "token", "metadata"] }
mpl-token-metadata = "3.2.3"
stack = { path = "../stack", features = ["cpi"] }
